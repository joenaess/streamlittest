name: Build and Deploy Streamlit App

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          echo ${{ secrets.GROQ_API_KEY }} > secrets.toml
          docker build --build-arg GROQ_API_KEY=$GROQ_API_KEY -t your-image-name .

      - name: Stop Existing Container (optional)
        run: docker stop my-streamlit-app || true

      - name: Remove Existing Container (optional)
        run: docker rm my-streamlit-app || true

      - name: Run Docker Container
        run: docker run -d -p 8501:8501 --name my-streamlit-app your-image-name
